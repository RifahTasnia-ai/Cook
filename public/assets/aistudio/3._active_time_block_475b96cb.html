<body class="bg-surface text-on-surface antialiased">
  <div class="min-h-[884px] max-w-md mx-auto bg-surface px-page-margin py-gutter-xl flex flex-col justify-between" data-stitch-vh="min-h-[884px]===min-h-screen">
    <!-- Minimal Top Metadata -->
    <header class="pt-gutter-lg flex flex-col items-center gap-gutter-sm text-center">
      <div class="flex items-center gap-gutter-sm">
        <span data-component-id="badge-numeric" data-component-type="badge" data-component-variant="numeric" role="status" class="inline-flex items-center justify-center rounded-full bg-primary text-on-primary px-gutter-md py-gutter-xs tabular-nums">
          <span data-design-text-token="label-sm" class="font-label text-label-sm">S-1</span>
        </span>
        <span data-design-text-token="label-md" class="font-label text-label-md text-on-surface-variant tabular-nums">Start 14:30</span>
      </div>
      <h1 data-design-text-token="title-md" class="font-body text-title-md text-on-surface max-w-xs">Finalize core API architecture spec</h1>
    </header>

    <!-- Large Centered Countdown Timer with Thin Progress Indicator -->
    <main class="flex flex-col items-center justify-center gap-gutter-xl py-section">
      <div class="flex flex-col items-center gap-gutter-lg w-full max-w-xs">
        <time data-component-id="typography-display" data-component-type="typography" data-component-variant="display" data-design-text-token="display-lg-mobile" class="font-display text-display-lg-mobile text-on-surface tabular-nums tracking-tight">42:18</time>

        <div class="w-full h-1 rounded-full bg-surface-container overflow-hidden" role="progressbar" aria-valuenow="6" aria-valuemin="0" aria-valuemax="100" aria-label="Block progress">
          <div class="h-1 rounded-full bg-secondary" style="width: 6%;"></div>
        </div>
      </div>
    </main>

    <!-- Single Deliberate Bottom Control -->
    <footer class="pb-gutter-lg">
      <button data-component-id="button-primary" data-component-type="button" data-component-variant="primary" type="button" class="w-full inline-flex items-center justify-center rounded-full bg-primary text-on-primary px-gutter-xl py-gutter-md font-label text-label-lg transition-colors duration-state-change ease-state-change hover:bg-on-primary-container active:scale-[0.99]">
        <span data-design-text-token="label-lg">Finish Block</span>
      </button>
    </footer>
  </div>

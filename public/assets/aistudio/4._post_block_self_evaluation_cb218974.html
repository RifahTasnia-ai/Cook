  <script id="tailwind-config">/** @type {import('tailwindcss').Config} */

        'error': '#E06C65',

      },
      fontFamily: {

      },
      fontSize: {

        'headline-lg': ['36px', { lineHeight: '42px', letterSpacing: '-0.5px', fontWeight: '600' }],
        'headline-lg-mobile': ['24px', { lineHeight: '30px', letterSpacing: '-0.25px', fontWeight: '600' }],
        'headline-md': ['20px', { lineHeight: '26px', letterSpacing: '-0.2px', fontWeight: '600' }],
        'title-lg': ['18px', { lineHeight: '24px', letterSpacing: '-0.1px', fontWeight: '600' }],
        'title-md': ['15px', { lineHeight: '20px', fontWeight: '600' }],
        'body-lg': ['16px', { lineHeight: '24px', fontWeight: '400' }],
        'body-md': ['14px', { lineHeight: '20px', fontWeight: '400' }],
        'body-sm': ['12px', { lineHeight: '18px', fontWeight: '400' }],
        'label-lg': ['15px', { lineHeight: '20px', letterSpacing: '0.1px', fontWeight: '600' }],
        'label-md': ['12px', { lineHeight: '16px', letterSpacing: '0.25px', fontWeight: '600' }],
        'label-sm': ['11px', { lineHeight: '14px', letterSpacing: '0.3px', fontWeight: '600' }],
        'mono-md': ['13px', { lineHeight: '18px', fontWeight: '500' }],
      },
      transitionDuration: {
        'state-change': '120ms',
        'surface-enter': '240ms',
        'surface-exit': '160ms',
      },
      transitionDelay: {
        'state-change': '0ms',
        'surface-enter': '0ms',
        'surface-exit': '0ms',
      },
      transitionTimingFunction: {
        'state-change': 'ease-out',
        'surface-enter': 'cubic-bezier(0.2, 0, 0, 1)',
        'surface-exit': 'cubic-bezier(0.3, 0, 1, 1)',
      },
    },

</script>
  <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@500;600;700&amp;family=Commissioner:wght@400;500;600&amp;family=Source+Code+Pro:wght@500;600&amp;display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=block" rel="stylesheet">
  <style>.material-symbols-outlined, .material-symbols-rounded, .material-symbols-sharp, .material-icons { display: inline-block; width: 1em; height: 1em; line-height: 1 !important; box-sizing: content-box; overflow: hidden; white-space: nowrap; direction: ltr; vertical-align: middle; }</style>
</head>
<body class="bg-surface text-on-surface antialiased">
  <div class="min-h-[884px] max-w-md mx-auto relative bg-surface flex flex-col justify-center px-gutter-xl py-gutter-xl" data-stitch-vh="min-h-[884px]===min-h-screen">
    <!-- Frosted-Blur Backdrop -->
    <div class="absolute inset-0 bg-scrim/75 backdrop-blur-md" aria-hidden="true"></div>

    <!-- Non-Dismissible Elevated Modal Card (24pt corners, 24pt padding) -->
    <section role="dialog" aria-modal="true" aria-labelledby="eval-title" class="relative z-10 w-full rounded-xl bg-surface-container-lowest border border-outline-variant p-gutter-xl shadow-2xl flex flex-col gap-gutter-xl">
      <!-- Compact Top Pill & Bold Task Title -->
      <header class="flex flex-col gap-gutter-sm">
        <div>
          <span data-component-id="badge-numeric" data-component-type="badge" data-component-variant="numeric" role="status" class="inline-flex items-center justify-center rounded-full bg-primary text-on-primary px-gutter-md py-gutter-xs tabular-nums">
            <span data-design-text-token="label-sm" class="font-label text-label-sm">S-1 • 45m logged</span>
          </span>
        </div>
        <h1 id="eval-title" data-design-text-token="headline-md" class="font-headline text-headline-md text-on-surface">Finalize core API architecture spec</h1>
      </header>

      <!-- Oversized Live Score Preview Banner -->
      <div class="rounded-lg bg-surface-container-low p-gutter-lg flex items-center justify-between gap-gutter-md">
        <div class="flex flex-col gap-gutter-xs">
          <span data-design-text-token="label-sm" class="font-label text-label-sm text-on-surface-variant">Earned Block Score</span>
          <span id="formula-sub" data-design-text-token="mono-md" class="font-mono text-mono-md text-on-surface-variant tabular-nums">Raw 28/35 × 1.5x</span>
        </div>
        <span id="formula-total" data-design-text-token="display-lg-mobile" class="font-display text-display-lg-mobile text-primary tabular-nums">+42.0 pts</span>
      </div>

      <!-- Quality Rate (1-10): Tactile Stepped Horizontal Scrubber Bar -->
      <div class="flex flex-col gap-gutter-sm">
        <div class="flex items-center justify-between">
          <span data-design-text-token="label-md" class="font-label text-label-md text-on-surface">Quality Rate</span>
          <span id="quality-readout" data-design-text-token="title-lg" class="font-title text-title-lg text-primary tabular-nums">8 / 10</span>
        </div>
        <input id="quality-slider" type="range" min="1" max="10" value="8" aria-label="Quality Rate" class="w-full h-3 rounded-full bg-surface-container accent-secondary cursor-pointer">
      </div>

      <!-- Finishing Rate (1-5): 5 Generous Rounded Tactile Pills -->
      <div class="flex flex-col gap-gutter-sm">
        <div class="flex items-center justify-between">
          <span data-design-text-token="label-md" class="font-label text-label-md text-on-surface">Finishing Rate</span>
          <span id="finishing-readout" data-design-text-token="title-lg" class="font-title text-title-lg text-primary tabular-nums">4 / 5</span>
        </div>
        <div id="finishing-grid" class="grid grid-cols-5 gap-gutter-md">
          <button type="button" data-f="1" class="h-12 rounded-full bg-surface-container text-on-surface font-label text-label-lg tabular-nums transition-colors duration-state-change ease-state-change">1</button>
          <button type="button" data-f="2" class="h-12 rounded-full bg-surface-container text-on-surface font-label text-label-lg tabular-nums transition-colors duration-state-change ease-state-change">2</button>
          <button type="button" data-f="3" class="h-12 rounded-full bg-surface-container text-on-surface font-label text-label-lg tabular-nums transition-colors duration-state-change ease-state-change">3</button>
          <button type="button" data-f="4" class="h-12 rounded-full bg-primary text-on-primary font-label text-label-lg tabular-nums transition-colors duration-state-change ease-state-change">4</button>
          <button type="button" data-f="5" class="h-12 rounded-full bg-surface-container text-on-surface font-label text-label-lg tabular-nums transition-colors duration-state-change ease-state-change">5</button>
        </div>
      </div>

      <!-- Action Rate (1-20): Precision Thick Slider + Circular 44pt Thumb Buttons -->
      <div class="flex flex-col gap-gutter-sm">
        <div class="flex items-center justify-between">
          <span data-design-text-token="label-md" class="font-label text-label-md text-on-surface">Action Rate</span>
          <span id="action-readout" data-design-text-token="title-lg" class="font-title text-title-lg text-primary tabular-nums">16 / 20</span>
        </div>
        <div class="flex items-center gap-gutter-md">
          <button id="action-minus" type="button" aria-label="Decrease Action Rate" class="w-11 h-11 rounded-full bg-surface-container text-on-surface font-label text-label-lg flex items-center justify-center shrink-0 hover:bg-secondary">-</button>
          <input id="action-slider" type="range" min="1" max="20" value="16" aria-label="Action Rate" class="w-full h-3 rounded-full bg-surface-container accent-secondary cursor-pointer">
          <button id="action-plus" type="button" aria-label="Increase Action Rate" class="w-11 h-11 rounded-full bg-surface-container text-on-surface font-label text-label-lg flex items-center justify-center shrink-0 hover:bg-secondary">+</button>
        </div>
      </div>

      <!-- Full-Pill 56pt CTA -->
      <button data-component-id="button-primary" data-component-type="button" data-component-variant="primary" type="button" class="w-full h-14 inline-flex items-center justify-center rounded-full bg-primary text-on-primary px-gutter-xl shadow-lg font-label text-label-lg transition-colors duration-state-change ease-state-change hover:bg-on-primary-container active:scale-[0.99]">
        <span data-design-text-token="label-lg">Submit &amp; Start 121s Silence</span>
      </button>
    </section>
  </div>

  <script>
    let q = 8, f = 4, a = 16;
    const totalEl = document.getElementById('formula-total');
    const subEl = document.getElementById('formula-sub');
    const qReadout = document.getElementById('quality-readout');
    const fReadout = document.getElementById('finishing-readout');
    const aReadout = document.getElementById('action-readout');
    const qSlider = document.getElementById('quality-slider');
    const aSlider = document.getElementById('action-slider');

    function updateFormula() {
      const raw = q + f + a;
      const pts = (raw * 1.5).toFixed(1);
      totalEl.textContent = `+${pts} pts`;
      subEl.textContent = `Raw ${raw}/35 × 1.5x`;
      qReadout.textContent = `${q} / 10`;
      fReadout.textContent = `${f} / 5`;
      aReadout.textContent = `${a} / 20`;
      aSlider.value = a;
    }

    qSlider.addEventListener('input', () => {
      q = Number(qSlider.value);
      updateFormula();
    });

    document.querySelectorAll('[data-f]').forEach((btn) => {
      btn.addEventListener('click', () => {
        f = Number(btn.dataset.f);
        document.querySelectorAll('[data-f]').forEach((b) => {
          b.classList.remove('bg-primary', 'text-on-primary');
          b.classList.add('bg-surface-container-low', 'text-on-surface');
        });
        btn.classList.remove('bg-surface-container-low', 'text-on-surface');
        btn.classList.add('bg-primary', 'text-on-primary');
        updateFormula();
      });
    });

    aSlider.addEventListener('input', () => {
      a = Number(aSlider.value);
      updateFormula();
    });
    document.getElementById('action-minus').addEventListener('click', () => {
      if (a > 1) { a--; updateFormula(); }
    });
    document.getElementById('action-plus').addEventListener('click', () => {
      if (a < 20) { a++; updateFormula(); }
    });
  </script>


</body></html>

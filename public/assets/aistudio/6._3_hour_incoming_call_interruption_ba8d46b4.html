      },
      fontFamily: {

      },

  <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@500;600;700&amp;family=Commissioner:wght@400;500;600&amp;family=Source+Code+Pro:wght@500;600&amp;display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=block" rel="stylesheet">
  <style>.material-symbols-outlined, .material-symbols-rounded, .material-symbols-sharp, .material-icons { display: inline-block; width: 1em; height: 1em; line-height: 1 !important; box-sizing: content-box; overflow: hidden; white-space: nowrap; direction: ltr; vertical-align: middle; }</style>
</head>
<body class="bg-inverse-surface text-inverse-on-surface antialiased">
  <div class="min-h-[884px] max-w-md mx-auto bg-inverse-surface px-page-margin py-gutter-xl flex flex-col justify-between" data-stitch-vh="min-h-[884px]===min-h-screen">
    <div class="pt-gutter-xl flex justify-center">
      <span data-design-text-token="label-sm" class="font-label text-label-sm text-on-surface-variant uppercase tracking-widest">Mandatory Check-In</span>
    </div>

    <!-- Centered Minimal Pulsing Geometric Ring Indicator & Title -->
    <main class="flex flex-col items-center justify-center gap-gutter-xl text-center">
      <div class="relative flex items-center justify-center w-36 h-36" aria-hidden="true">
        <div class="absolute inset-0 rounded-full border border-secondary/40 animate-ping"></div>
        <div class="absolute inset-4 rounded-full border border-on-surface-variant/50"></div>
        <div class="w-20 h-20 rounded-full border-2 border-secondary flex items-center justify-center">
          <span class="material-symbols-outlined text-[32px] text-secondary">schedule</span>
        </div>
      </div>

      <div class="flex flex-col gap-gutter-sm">
        <h1 data-design-text-token="headline-lg-mobile" class="font-headline text-headline-lg-mobile text-inverse-on-surface">3-Hour Turbo Audit</h1>
        <p data-design-text-token="body-lg" class="font-body text-body-lg text-on-surface-variant">Time 3 — Judgment &amp; Priming</p>
      </div>
    </main>

    <!-- Single Bottom Tactile Slide to Answer Control (Strictly NO Decline, Dismiss, or Snooze) -->
    <footer class="pb-gutter-xl">
      <div class="relative w-full h-14 rounded-full bg-surface-container-lowest border border-outline-variant flex items-center px-gutter-xs overflow-hidden">
        <span id="slide-label" data-design-text-token="label-lg" class="w-full text-center font-label text-label-lg text-on-surface pointer-events-none select-none">
          Slide to Answer
        </span>
        <input id="slide-to-answer" type="range" min="0" max="100" value="0" aria-label="Slide to Answer" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-20">
        <div id="slide-thumb" class="absolute left-1.5 w-11 h-11 rounded-full bg-primary text-on-primary flex items-center justify-center pointer-events-none transition-transform duration-state-change ease-state-change">
          <span class="material-symbols-outlined text-[22px]">arrow_forward</span>
        </div>
      </div>
    </footer>
  </div>

  <script>
    const slider = document.getElementById('slide-to-answer');
    const thumb = document.getElementById('slide-thumb');
    const label = document.getElementById('slide-label');
    slider.addEventListener('input', () => {
      const val = Number(slider.value);
      const maxShift = slider.parentElement.clientWidth - 56;
      thumb.style.transform = `translateX(${(val / 100) * maxShift}px)`;
      if (val >= 92) {
        label.textContent = 'Answering Audit...';
      } else {
        label.textContent = 'Slide to Answer';
      }
    });
    slider.addEventListener('change', () => {
      if (Number(slider.value) < 92) {
        slider.value = 0;
        thumb.style.transform = 'translateX(0px)';
        label.textContent = 'Slide to Answer';
      }
    });
  </script>


</body></html>

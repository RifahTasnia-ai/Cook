<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>End-of-Day Summary</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script id="tailwind-config">/** @type {import('tailwindcss').Config} */
globalThis.tailwind = globalThis.tailwind || {};
globalThis.tailwind.config = {
  darkMode: 'class',
  theme: {
    extend: {
      colors: {
        'primary': '#DCEBE6',
        'on-primary': '#0A1412',
        'primary-container': '#27524B',
        'on-primary-container': '#DCEBE6',
        'secondary': '#4D7B73',

        'on-surface': '#DCEBE6',
        'on-surface-variant': '#8FB8AE',
        'outline': '#8FB8AE',
        'outline-variant': '#27524B',
        'inverse-surface': '#0A1412',
        'inverse-on-surface': '#DCEBE6',
        'inverse-primary': '#4D7B73',
        'success': '#4D7B73',
        'on-success': '#F8F9F8',
        'success-container': '#27524B',
        'on-success-container': '#DCEBE6',
        'warning': '#C98A4B',
        'on-warning': '#0A1412',
        'warning-container': '#2A2218',
        'on-warning-container': '#C98A4B',
        'error': '#E06C65',
        'on-error': '#0A1412',
        'error-container': '#3B1816',
        'on-error-container': '#F9DADA',
        'scrim': '#0A1412',
      },
      borderRadius: {
        'sm': '6px',
        'DEFAULT': '8px',
        'md': '12px',
        'lg': '16px',
        'xl': '24px',
        'full': '9999px',
      },
      spacing: {
        'gutter-xs': '4px',
        'gutter-sm': '8px',
        'gutter-md': '12px',
        'gutter-lg': '16px',
        'gutter-xl': '24px',
        'section': '28px',
        'page-margin': '20px',
      },
      fontFamily: {
        'display': ['"Albert Sans"', 'sans-serif'],
        'headline': ['"Albert Sans"', 'sans-serif'],
        'title': ['"Albert Sans"', 'sans-serif'],
        'body': ['"Commissioner"', 'sans-serif'],
        'label': ['"Commissioner"', 'sans-serif'],
        'mono': ['"Source Code Pro"', 'monospace'],
      },
      fontSize: {
        'display-lg': ['48px', { lineHeight: '52px', letterSpacing: '-1px', fontWeight: '600' }],
        'display-lg-mobile': ['32px', { lineHeight: '36px', letterSpacing: '-0.5px', fontWeight: '600' }],
        'headline-lg': ['36px', { lineHeight: '42px', letterSpacing: '-0.5px', fontWeight: '600' }],
        'headline-lg-mobile': ['24px', { lineHeight: '30px', letterSpacing: '-0.25px', fontWeight: '600' }],
        'headline-md': ['20px', { lineHeight: '26px', letterSpacing: '-0.2px', fontWeight: '600' }],
        'title-lg': ['18px', { lineHeight: '24px', letterSpacing: '-0.1px', fontWeight: '600' }],
        'title-md': ['15px', { lineHeight: '20px', fontWeight: '600' }],
        'body-lg': ['16px', { lineHeight: '24px', fontWeight: '400' }],
        'body-md': ['14px', { lineHeight: '20px', fontWeight: '400' }],
        'body-sm': ['12px', { lineHeight: '18px', fontWeight: '400' }],
        'label-lg': ['15px', { lineHeight: '20px', letterSpacing: '0.1px', fontWeight: '600' }],
        'label-md': ['12px', { lineHeight: '16px', letterSpacing: '0.25px', fontWeight: '600' }],
        'label-sm': ['11px', { lineHeight: '14px', letterSpacing: '0.3px', fontWeight: '600' }],
        'mono-md': ['13px', { lineHeight: '18px', fontWeight: '500' }],
      },
      transitionDuration: {
        'state-change': '120ms',
        'surface-enter': '240ms',
        'surface-exit': '160ms',
      },
      transitionDelay: {
        'state-change': '0ms',
        'surface-enter': '0ms',
        'surface-exit': '0ms',
      },
      transitionTimingFunction: {
        'state-change': 'ease-out',
        'surface-enter': 'cubic-bezier(0.2, 0, 0, 1)',
        'surface-exit': 'cubic-bezier(0.3, 0, 1, 1)',

</script>
  <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@500;600;700&amp;family=Commissioner:wght@400;500;600&amp;family=Source+Code+Pro:wght@500;600&amp;display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=block" rel="stylesheet">
  <style>.material-symbols-outlined, .material-symbols-rounded, .material-symbols-sharp, .material-icons { display: inline-block; width: 1em; height: 1em; line-height: 1 !important; box-sizing: content-box; overflow: hidden; white-space: nowrap; direction: ltr; vertical-align: middle; }</style>
</head>
<body class="bg-surface text-on-surface antialiased">
  <div class="min-h-[884px] max-w-md mx-auto relative bg-surface px-gutter-xl py-gutter-xl flex items-center justify-center" data-stitch-vh="min-h-[884px]===min-h-screen">
    <!-- Frosted-Blur Backdrop -->
    <div class="absolute inset-0 bg-scrim/75 backdrop-blur-md" aria-hidden="true"></div>

    <!-- Refined Bento Scorecard Modal (24pt corners, 24pt padding) -->
    <section role="dialog" aria-modal="true" aria-labelledby="eod-title" class="relative z-10 w-full rounded-xl bg-surface-container-lowest border border-outline-variant p-gutter-xl shadow-2xl flex flex-col gap-gutter-xl">
      <header class="flex items-center justify-between gap-gutter-sm">
        <span data-design-text-token="label-md" class="font-label text-label-md text-on-surface-variant">End of Day</span>
        <span data-component-id="badge-success" data-component-type="badge" data-component-variant="success" role="status" class="inline-flex items-center justify-center rounded-full bg-secondary text-on-secondary px-gutter-md py-gutter-xs">
          <span data-design-text-token="label-sm" class="font-label text-label-sm">Active Zone — Passed</span>
        </span>
      </header>

      <!-- Hero Sculptural Score Centerpiece -->
      <div class="flex flex-col items-center text-center gap-gutter-xs py-gutter-sm">
        <h1 id="eod-title" data-design-text-token="display-lg-mobile" class="font-display text-display-lg-mobile text-on-surface tabular-nums">54</h1>
        <span data-design-text-token="body-md" class="font-body text-body-md text-on-surface-variant tabular-nums">/ 50 pass mark</span>
      </div>

      <!-- Clean 2x2 Borderless Bento Metric Tiles (16pt corners, 12pt gap) -->
      <div class="grid grid-cols-2 gap-gutter-md">
        <div class="rounded-lg bg-surface-container-low p-gutter-lg flex flex-col gap-gutter-xs">
          <span data-design-text-token="label-sm" class="font-label text-label-sm text-on-surface-variant">S-1 Completed</span>
          <span data-design-text-token="title-lg" class="font-title text-title-lg text-on-surface tabular-nums">1/1</span>
        </div>

        <div class="rounded-lg bg-surface-container-low p-gutter-lg flex flex-col gap-gutter-xs">
          <span data-design-text-token="label-sm" class="font-label text-label-sm text-on-surface-variant">A &amp; B Tasks</span>
          <span data-design-text-token="title-lg" class="font-title text-title-lg text-on-surface tabular-nums">3 done</span>
        </div>

        <div class="rounded-lg bg-surface-container-low p-gutter-lg flex flex-col gap-gutter-xs">
          <span data-design-text-token="label-sm" class="font-label text-label-sm text-on-surface-variant">Check-Ins</span>
          <span data-design-text-token="title-lg" class="font-title text-title-lg text-on-surface tabular-nums">+20 pts</span>
        </div>

        <div class="rounded-lg bg-surface-container-low p-gutter-lg flex flex-col gap-gutter-xs">
          <span data-design-text-token="label-sm" class="font-label text-label-sm text-on-surface-variant">Tracked Time</span>
          <span data-design-text-token="title-lg" class="font-title text-title-lg text-on-surface tabular-nums">4h 57m</span>
        </div>
      </div>

      <!-- Full-Pill 56pt Bottom CTA -->
      <button data-component-id="button-primary" data-component-type="button" data-component-variant="primary" type="button" class="w-full h-14 inline-flex items-center justify-center rounded-full bg-primary text-on-primary px-gutter-xl shadow-lg font-label text-label-lg transition-colors duration-state-change ease-state-change hover:bg-on-primary-container active:scale-[0.99]">
        <span data-design-text-token="label-lg">Close Day</span>
      </button>
    </section>
  </div>


</body></html>

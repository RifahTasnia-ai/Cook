  <meta charset="UTF-8">

        'inverse-surface': '#0A1412',

        'inverse-primary': '#4D7B73',
        'success': '#4D7B73',
        'on-success': '#F8F9F8',
        'success-container': '#27524B',
        'on-success-container': '#DCEBE6',
        'warning': '#C98A4B',
        'on-warning': '#0A1412',
        'warning-container': '#2A2218',
        'on-warning-container': '#C98A4B',
        'error': '#E06C65',
        'on-error': '#0A1412',
        'error-container': '#3B1816',

      },

      },
      spacing: {
        'gutter-xs': '4px',
        'gutter-sm': '8px',
        'gutter-md': '12px',
        'gutter-lg': '16px',
        'gutter-xl': '24px',
        'section': '28px',
        'page-margin': '20px',
      },
      fontFamily: {
        'display': ['"Albert Sans"', 'sans-serif'],
        'headline': ['"Albert Sans"', 'sans-serif'],
        'title': ['"Albert Sans"', 'sans-serif'],
        'body': ['"Commissioner"', 'sans-serif'],
        'label': ['"Commissioner"', 'sans-serif'],
        'mono': ['"Source Code Pro"', 'monospace'],
      },
      fontSize: {
        'display-lg': ['48px', { lineHeight: '52px', letterSpacing: '-1px', fontWeight: '600' }],
        'display-lg-mobile': ['32px', { lineHeight: '36px', letterSpacing: '-0.5px', fontWeight: '600' }],
        'headline-lg': ['36px', { lineHeight: '42px', letterSpacing: '-0.5px', fontWeight: '600' }],
        'headline-lg-mobile': ['24px', { lineHeight: '30px', letterSpacing: '-0.25px', fontWeight: '600' }],
        'headline-md': ['20px', { lineHeight: '26px', letterSpacing: '-0.2px', fontWeight: '600' }],

        'body-md': ['14px', { lineHeight: '20px', fontWeight: '400' }],
        'body-sm': ['12px', { lineHeight: '18px', fontWeight: '400' }],

        'label-sm': ['11px', { lineHeight: '14px', letterSpacing: '0.3px', fontWeight: '600' }],

      },
      transitionDuration: {
        'state-change': '120ms',
        'surface-enter': '240ms',
        'surface-exit': '160ms',
      },
      transitionDelay: {
        'state-change': '0ms',
        'surface-enter': '0ms',
        'surface-exit': '0ms',
      },
      transitionTimingFunction: {
        'state-change': 'ease-out',
        'surface-enter': 'cubic-bezier(0.2, 0, 0, 1)',

  <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@500;600;700&amp;family=Commissioner:wght@400;500;600&amp;family=Source+Code+Pro:wght@500;600&amp;display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=block" rel="stylesheet">
  <style>.material-symbols-outlined, .material-symbols-rounded, .material-symbols-sharp, .material-icons { display: inline-block; width: 1em; height: 1em; line-height: 1 !important; box-sizing: content-box; overflow: hidden; white-space: nowrap; direction: ltr; vertical-align: middle; }</style>
</head>
<body class="bg-surface text-on-surface antialiased">
  <div class="min-h-[884px] max-w-md mx-auto bg-surface px-page-margin py-gutter-xl flex flex-col justify-between" data-stitch-vh="min-h-[884px]===min-h-screen">
    <div class="pt-gutter-lg" aria-hidden="true"></div>

    <!-- Centered Stillness Focal Point -->
    <main class="flex flex-col items-center justify-center gap-gutter-xl text-center px-gutter-md">
      <time id="silence-timer" data-component-id="typography-display-muted" data-component-type="typography" data-component-variant="display" data-design-text-token="display-lg-mobile" class="font-display text-display-lg-mobile text-on-surface-variant tabular-nums">02:01</time>

      <ol class="flex flex-col gap-gutter-sm max-w-xs text-left">
        <li data-design-text-token="body-md" class="font-body text-body-md text-on-surface-variant">
          1. Without phone and any electronic device
        </li>
        <li data-design-text-token="body-md" class="font-body text-body-md text-on-surface-variant">
          2. Spend alone in silence, like meditation
        </li>
      </ol>
    </main>

    <!-- Subtle Bottom Early-Exit Link -->
    <footer class="pb-gutter-lg flex justify-center">
      <button id="early-exit-trigger" type="button" class="px-gutter-md py-gutter-sm font-label text-label-md text-on-surface-variant hover:text-on-surface transition-colors duration-state-change ease-state-change">
        <span data-design-text-token="label-md">End reset early</span>
      </button>
    </footer>
  </div>

  <!-- Confirmation Warning Popup -->
  <dialog id="early-exit-dialog" role="alertdialog" data-component-id="modal-alert" data-component-type="modal" data-component-variant="alert" aria-labelledby="early-exit-title" aria-describedby="early-exit-body" class="rounded-xl bg-surface-container-lowest text-on-surface border border-outline-variant p-gutter-xl max-w-sm w-full backdrop:bg-scrim/50">
    <header class="mb-gutter-md">
      <h2 id="early-exit-title" data-design-text-token="title-lg" class="font-title text-title-lg text-on-surface">Exit silence early?</h2>
    </header>
    <div id="early-exit-body" class="mb-gutter-xl">
      <p data-design-text-token="body-md" class="font-body text-body-md text-on-surface-variant">
        Leaving before 00:00 interrupts your 121-second attention-residue reset.
      </p>
    </div>
    <footer class="flex items-center justify-end gap-gutter-sm">
      <button id="stay-btn" type="button" class="rounded-full bg-surface-container-low text-on-surface px-gutter-lg py-gutter-sm">
        <span data-design-text-token="label-lg" class="font-label text-label-lg">Stay in Silence</span>
      </button>
      <button id="confirm-exit-btn" type="button" class="rounded-full bg-error text-on-error px-gutter-lg py-gutter-sm">
        <span data-design-text-token="label-lg" class="font-label text-label-lg">Exit Early</span>
      </button>
    </footer>
  </dialog>

  <script>
    const exitDialog = document.getElementById('early-exit-dialog');
    document.getElementById('early-exit-trigger').addEventListener('click', () => exitDialog.showModal());
    document.getElementById('stay-btn').addEventListener('click', () => exitDialog.close());
    document.getElementById('confirm-exit-btn').addEventListener('click', () => exitDialog.close());
  </script>


</body></html>
